[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi[standard]>=0.136.1",
    "keyboard>=0.13.5",
    "mediapipe==0.10.21",
    "msgpack-rpc-python>=0.4.1",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "websockets>=16.0",
    "tornado==4.5.3",
    "backports.ssl-match-hostname",
    "input",
    "pytest-asyncio>=1.3.0",
    "cryptography==41.0.7",
    "airsim",
    "projectairsim",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/backend", "services"]
include = ["app", "app.*", "services", "services.*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "pytest-asyncio>=0.23",
]

[tool.uv.extra-build-dependencies]
airsim = ["setuptools", "wheel", "numpy", "msgpack-rpc-python", "backports.ssl-match-hostname"]

[tool.uv.sources]
projectairsim = { path = "vendors/projectairsim", editable = true }

[tool.uv]
constraint-dependencies = ["msgpack>=1.0.5"]

[tool.ruff]
exclude = ["vendors"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # bugs + certain code breaks
    "F",   # logical errors + unused code
    "I",   # import ordering
    "N",   # python naming conventions
]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/backend", "services"]
filterwarnings = [
    "ignore:module 'sre_parse' is deprecated:DeprecationWarning",
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning",
]