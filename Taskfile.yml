# basically a makefile for windows 
version: "3"

dotenv: [".env"]

vars:
  FRONTEND_DIR: apps/frontend
  BACKEND_APP: apps/backend/app/main.py
  SERVICES_DIR: services

tasks:

  install:
    desc: Install backend + frontend deps
    cmds:
      - uv venv --python 3.11
      - uv pip install setuptools wheel numpy msgpack-rpc-python
      - uv sync --all-groups --python 3.11 --no-build-isolation-package airsim
      - cmd: cd {{.FRONTEND_DIR}} && yarn install

  dev:
    desc: Runs backend and frontend in dev mode
    deps:
      - backend-dev
      - frontend-dev
    
  backend-dev:
    internal: true # not possible to call outside
    cmds:
      - uv run fastapi dev {{.BACKEND_APP}}  --port {{.BACKENDPORT}}

  frontend-dev:
    internal: true
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - yarn dev
  
  build:
    desc: Builds the backend and frontend
    deps:
      - backend-build
      - frontend-build
  
  backend-build:
    internal: true
    cmds:
      - uv run fastapi run  {{.BACKEND_APP}} --port {{.BACKENDPORT}}
  
  frontend-build:
    internal: true
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - yarn build

  unit-test:
    desc: Runs Frontend and Backend Unit Tests

  backend-unit-test:
    desc: Runs backend unit tests
    cmds:
      - uv run pytest apps/backend/tests services/tests --cov  --cov-report=term-missing

  test:
    desc: Runs backend, frontend, and services testing
    deps:
      - backend-test
      - frontend-test
  
  backend-test:
    internal: true
    desc: Runs backend testing
    cmds:
      - uv run pytest --cov --cov-report=term-missing


  frontend-test:
    internal: true
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - yarn test

  lint:
    desc: Runs lint checks
    deps:
      - backend-lint
      - frontend-lint

  backend-lint:
    internal: true
    cmds:
      - uv run ruff check --output-format=github

  frontend-lint:
    internal: true
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - yarn lint

  fix:
    desc: Automatically fixes Ruff issues
    deps:
      - backend-fix
      - frontend-fix
  
  backend-fix:
    internal: true
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .
  
  frontend-fix:
    internal: true
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - yarn format
  
  services-install:
    desc: Install services package
    cmds:
      - pip install -e "{{.SERVICES_DIR}}[dev]" --break-system-packages
  
  services-test:
    desc: Runs test cases in services
    cmds:
      - uv run pytest services/tests

  sim-as:
    desc: Runs the old pain in the ass sim
    cmds:
      - cmd: powershell -Command "Start-Process '{{.AS_PATH}}'"
        platforms: [windows]

  sim-pas: 
    desc: Launches PAS, the UE5 version
    cmds:
      - cmd: powershell -Command "Start-Process '{{.PAS_PATH}}'"
        platforms: [windows]
  
  sim-pas-demo:
    desc: Launches PAS, and the drone adapter demo
    cmds:
      - cmd: powershell -Command "Start-Process '{{.PAS_PATH}}'"
        platforms: [windows]
      - cmd: uv run adapter_demo.py
  
  sim-beeg-demo:
    desc: Test your laptop out 
    deps:
      - sim-pas-demo
      - sim-as 
  
  prereqs:
    desc: install all prereqs (add more as identified)
    cmds:
      - cmd: winget install Python.Python.3.11 astral-sh.uv Microsoft.DirectX --accept-package-agreements --accept-source-agreements
        platforms: [windows]
      - cmd: npm install -g yarn
        platforms:  [windows]
      - cmd: |
          sudo apt update && sudo apt install  -y python3.11 python3.11-venv nodejs npm curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          npm install -g yarn
        platforms: [linux]
  