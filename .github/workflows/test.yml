name: Test

on:  
  pull_request:
    branches: [dev,main,'Use-Case**']


jobs:
  Backend-Unit-Tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_SECRET_KEY: BwuCYnAL1AcvIE4IlVwVhEMBJX-hBmSyOfOsUvneSrM

    steps:
      - uses: actions/checkout@v4
        with: 
          submodules: true

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b        
        with: 
          version: "0.11.13"
          enable-cache: true

      - uses: actions/setup-python@v5
        with: 
          python-version: 3.11

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 
        with:
          repo-token: ${{secrets.GITHUB_TOKEN}}



      - name: Install Dependencies
        run: task install

      - name: PyTest Testing
        run: task backend-unit-test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@8f6ec407a34d5ec2b33d7d8f7f50279493b5efb4
        with:
          files: apps/backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@8f6ec407a34d5ec2b33d7d8f7f50279493b5efb4
        with:
          files: services/coverage.xml
          flags: services
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  Frontend-Unit-Tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: 
      run: 
        working-directory: apps/frontend

    env:
      BACKENDPORT: 3001

    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'yarn'
          cache-dependency-path: 'apps/frontend/yarn.lock'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps

      - name: Run Playwright testing
        run: yarn unit-test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            apps/frontend/test-results
            apps/frontend/playwright-report

  Integration-Tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: ["Frontend-Unit-Tests", "Backend-Unit-Tests"]

    env:
      JWT_SECRET_KEY: BwuCYnAL1AcvIE4IlVwVhEMBJX-hBmSyOfOsUvneSrM

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b        
        with: 
          version: "0.11.13"
          enable-cache: true

      - uses: actions/setup-python@v5
        with: 
          python-version: 3.11

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 
        with:
          repo-token: ${{secrets.GITHUB_TOKEN}}

      - name: Install Dependencies
        run: task install

      - name: Integration Testing
        run: task integration-test

  End-To-End-Tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: ["Integration-Tests"]
    env:
      BACKENDPORT: 3001
      JWT_SECRET_KEY: BwuCYnAL1AcvIE4IlVwVhEMBJX-hBmSyOfOsUvneSrM

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'yarn'
          cache-dependency-path: 'apps/frontend/yarn.lock'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b        
        with: 
          version: "0.11.13"
          enable-cache: true

      - uses: actions/setup-python@v5
        with: 
          python-version: 3.11

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 
        with:
          repo-token: ${{secrets.GITHUB_TOKEN}}
      
      - name: Install Dependencies
        run: task install

      - name: End To End Testing
        run: task e2e-test
