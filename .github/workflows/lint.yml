name: Lint

on: 
  pull_request:
    branches: ['**'] 


jobs:

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with: 
          submodules: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b        
        with: 
          version: "0.11.13"
          enable-cache: true
      - uses: actions/setup-python@v5
        with: 
          python-version: 3.11

      - uses: arduino/setup-task@v2
        with:
          version: "3.51.1"
          enable-cache: true 

      - name: Install Dependencies
        run: task install

      - name: Ruff Linter
        run: task lint