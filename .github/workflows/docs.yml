name: Deploy Docs

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'landing_page/**'
      - '.github/workflows/docs.yml'

# Required for GitHub Pages deployment from Actions
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history required for git-revision-date-localized plugin
          fetch-depth: 0

      # landing page
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: landing_page/yarn.lock
        
      - name: Install landing page dependencies
        working-directory: landing_page
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build landing page
        working-directory: landing_page
        run: yarn build

      # docs (mkdocs)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install MkDocs and plugins
        run: |
          pip install --upgrade pip
          pip install \
            mkdocs \
            mkdocs-material \
            mkdocs-git-revision-date-localized-plugin \
            pymdown-extensions \
            pillow \
            cairosvg

      - name: Build docs
        run: mkdocs build --clean --site-dir site_build

        # combine landing page at root, docs under /docs
      - name: Build and deploy to GitHub Pages
        run: |
          mkdir -p deploy
          cp -r landing_page/dist/* deploy/
          mkdir -p deploy/docs
          cp -r site_build/* deploy/docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
