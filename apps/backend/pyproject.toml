[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.136.1",
    "keyboard>=0.13.5",
    "mediapipe>=0.10.35",
    "msgpack-rpc-python>=0.4.1",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "websockets>=16.0",
    "drone-services",
    "pytest-asyncio>=1.3.0",
]

[tool.uv.sources]
drone-services = { path = "../../services", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # bugs + certain code breaks
    "F",   # logical errors + unused code
    "I",   # import ordering
    "N",   # python naming conventions
]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.uv.extra-build-dependencies]
airsim = ["setuptools", "wheel", "numpy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../../services"]