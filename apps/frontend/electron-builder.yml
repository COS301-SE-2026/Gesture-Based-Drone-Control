appId: com.codexmerchants.gesturebaseddronecontrol
productName: GestureBasedDroneControl

directories: 
  output: ../../release

files :
  - "dist/**/*"
  - "electron/**/*"
asarUnpack:
  - "dist/assets/*.mp4"

extraResources:
  - from: "../../dist/GestureBasedDroneControl-Backend"
    to: "backend/GestureBasedDroneControl-Backend"
  - from: "../../build/sim"
    to: "sim"
  - from: "../../build/signalling"
    to: "signalling"

win:
  target: portable
  icon: ../../packaging/app-icon.ico
  extraResources:
  - from: "../../dist/GestureBasedDroneControl-Backend.exe"
    to: "backend/GestureBasedDroneControl-Backend.exe"
  - from: "../../build/sim"
    to: "sim"
  - from: "../../build/signalling"
    to: "signalling"
linux:
  target: AppImage
  icon: ../../packaging/app-icon.png
  category: Utility
  executableName: gesture-based-drone-control