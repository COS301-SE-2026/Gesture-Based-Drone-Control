appId: com.codexmerchants.gesturebaseddronecontrol
productName: GestureBasedDroneControl 

directories: 
  output: ../../release

files :
  - "dist/**/*"
  - "electron/**/*"
asarUnpack:
  - "dist/assets/*.mp4"

extraResources:
  - from: "../../dist"
    to: "backend"

win:
  target: portable
linux:
  target: AppImage