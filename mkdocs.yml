site_name: Gesture-Based Drone Control
site_description: Real-time gesture-to-flight-command pipeline using MediaPipe Hands, rule-based + TFLite recognition, FastAPI WebSocket backend, and a React/TypeScript telemetry dashboard.
site_url: https://cos301-se-2026.github.io/Gesture-Based-Drone-Control/
repo_url: https://github.com/COS301-SE-2026/Gesture-Based-Drone-Control
repo_name: COS301-SE-2026/Gesture-Based-Drone-Control

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Plan: PLAN.md
  - Design: DESIGN.md
  - SRS: SRS.md
  - Git Guide: GIT.md
  - CI/CD: CICD.md
  - API Reference: api/API_REFERENCE.md
  - Testing: testing/TESTING.md
  - Demo: demo/Deployment.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
  - toc:
      permalink: true