<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="22" height="22" fill="none" aria-hidden="true">
  <!-- Drone side profile -->
  <!-- Top propeller bar -->
  <line x1="4" y1="11" x2="28" y2="11" stroke="#A4161A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Vertical struts -->
  <line x1="9" y1="11" x2="9" y2="17" stroke="#A4161A" stroke-width="1.4"/>
  <line x1="23" y1="11" x2="23" y2="17" stroke="#A4161A" stroke-width="1.4"/>
  <!-- Drone body -->
  <rect x="9" y="15" width="14" height="7" rx="2" fill="#161A1D" stroke="#E5383B" stroke-width="1.4"/>
  <!-- Camera lens -->
  <circle cx="16" cy="18.5" r="1.5" fill="#E5383B"/>
  <!-- Landing skids -->
  <line x1="7" y1="24" x2="13" y2="24" stroke="#A4161A" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="19" y1="24" x2="25" y2="24" stroke="#A4161A" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="10" y1="22" x2="10" y2="24" stroke="#A4161A" stroke-width="1.2"/>
  <line x1="22" y1="22" x2="22" y2="24" stroke="#A4161A" stroke-width="1.2"/>
  <!-- Propeller blur indicator -->
  <ellipse cx="6" cy="11" rx="3" ry="0.8" fill="#B1A7A6" opacity="0.7"/>
  <ellipse cx="26" cy="11" rx="3" ry="0.8" fill="#B1A7A6" opacity="0.7"/>
</svg>
