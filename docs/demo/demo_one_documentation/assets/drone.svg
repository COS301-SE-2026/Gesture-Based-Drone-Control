<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="22" height="22" fill="none" aria-hidden="true">
  <!-- Quadcopter top-down silhouette in crimson palette -->
  <!-- Cross arms -->
  <line x1="6" y1="6" x2="26" y2="26" stroke="#A4161A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="6" y1="26" x2="26" y2="6" stroke="#A4161A" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Center body -->
  <circle cx="16" cy="16" r="3.2" fill="#161A1D" stroke="#E5383B" stroke-width="1.6"/>
  <circle cx="16" cy="16" r="1.3" fill="#E5383B"/>
  <!-- Propeller rotors -->
  <circle cx="6" cy="6" r="3" fill="none" stroke="#A4161A" stroke-width="1.4"/>
  <circle cx="26" cy="6" r="3" fill="none" stroke="#A4161A" stroke-width="1.4"/>
  <circle cx="6" cy="26" r="3" fill="none" stroke="#A4161A" stroke-width="1.4"/>
  <circle cx="26" cy="26" r="3" fill="none" stroke="#A4161A" stroke-width="1.4"/>
  <!-- Rotor dots -->
  <circle cx="6" cy="6" r="0.9" fill="#E5383B"/>
  <circle cx="26" cy="6" r="0.9" fill="#E5383B"/>
  <circle cx="6" cy="26" r="0.9" fill="#E5383B"/>
  <circle cx="26" cy="26" r="0.9" fill="#E5383B"/>
</svg>
