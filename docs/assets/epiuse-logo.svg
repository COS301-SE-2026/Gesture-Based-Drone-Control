<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" role="img" aria-label="EPI-USE Labs">
  <!-- Background plate -->
  <rect width="320" height="90" rx="6" fill="#161A1D" stroke="#A4161A" stroke-width="1.5"/>

  <!-- Glyph mark on the left: stylized E with circular emphasis -->
  <g transform="translate(22,18)">
    <!-- Circle base -->
    <circle cx="27" cy="27" r="25" fill="none" stroke="#A4161A" stroke-width="2"/>
    <circle cx="27" cy="27" r="18" fill="none" stroke="#660708" stroke-width="1.2"/>
    <!-- E letterform -->
    <g transform="translate(15,12)">
      <rect x="0" y="0" width="4" height="30" fill="#F5F3F4"/>
      <rect x="0" y="0" width="22" height="4" fill="#F5F3F4"/>
      <rect x="0" y="13" width="17" height="4" fill="#E5383B"/>
      <rect x="0" y="26" width="22" height="4" fill="#F5F3F4"/>
    </g>
  </g>

  <!-- Wordmark on the right -->
  <g transform="translate(94,28)">
    <text x="0" y="14" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#F5F3F4" letter-spacing="1">EPI-USE</text>
    <text x="98" y="14" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="22" fill="#E5383B" letter-spacing="2">Labs</text>
    <line x1="0" y1="22" x2="190" y2="22" stroke="#A4161A" stroke-width="0.8"/>
    <text x="0" y="36" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="8" fill="#B1A7A6" letter-spacing="3">PROJECT  ·  CLIENT  ·  SPONSOR</text>
  </g>
</svg>
