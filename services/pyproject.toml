# services/pyproject.toml
# allow all services scripts to work a bit more cleanly with one another and eventually the apis

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-services"
version = "0.1.0"
description = "CV pipeline, gesture recognition, and drone control adapters"
requires-python = ">=3.11"

dependencies = [
    "opencv-python>=4.8",
    "mediapipe==0.10.21",
    "tornado==4.5.3",
    "numpy>=1.26",
    "msgpack-rpc-python",
    "backports.ssl-match-hostname",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "projectairsim",
    "websockets>=16.0",
    "input",
]

[project.optional-dependencies]
airsim = ["airsim"]
dev    = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["services", "services.*"]

[tool.uv.extra-build-dependencies]
airsim = [
    "numpy",
    "msgpack-rpc-python",
    "backports.ssl-match-hostname",
]

[tool.uv.sources]
projectairsim = {git = "https://github.com/ShavirV/ProjectAirSim_GBDC.git", subdirectory = "projectairsim"}
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # bugs + certain code breaks
    "F",   # logical errors + unused code
    "I",   # import ordering
    "N",   # python naming conventions
]
ignore = ["E402"]


[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore:module 'sre_parse' is deprecated:DeprecationWarning",
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning",
]