<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
pre{
    background:#202020;
    font-size:14px;
    color: azure;
    overflow:auto;
}
</style>

<h2>Gamepad API test</h2>

<div id="status">No controller connected</div>

<pre id="out"></pre>

<script>

let controller = null;
const statusEl = document.getElementById("status");
const outEl = document.getElementById("out");

window.addEventListener("gamepadconnected", e=>{
    controller = e.gamepad.index;
    statusEl.textContent = "Connected: " + e.gamepad.id
});

window.addEventListener("gamepaddisconnected", () =>{
    controller = null;
    statusEl.textContent= "Disconnected"
});

// add a deadzone and ignore all inputs below this deadzone.
// adjust higher for shittier controllers
const DEADZONE = 0.08;

// sanitize all analog inputs to ignore anything within the deadzone
function cleanAxis(axis){
    if(Math.abs(axis) < DEADZONE)
        return 0;
    return Number(axis.toFixed(3));
}

// call 60ish times a second and in implementation, chuck this into the websocket
function poll(){
    if (controller !== null){
        const pad = navigator.getGamepads()[controller];

        if(pad){
            // likely will be the exact json schema used in the actual controller 
            const payload = {
                
                leftStick:{
                    x: cleanAxis(pad.axes[0]),
                    y: cleanAxis(pad.axes[1])
                },

                rightStick:{
                    x: cleanAxis(pad.axes[2]),
                    y: cleanAxis(pad.axes[3])
                },

                triggers:{
                    left: Number(((pad.buttons[6]?.value)||0).toFixed(3)),
                    right:Number(((pad.buttons[7]?.value)||0).toFixed(3))
                },

                buttons:{
                    A: pad.buttons[0]?.pressed || false,
                    B: pad.buttons[1]?.pressed || false,
                    X: pad.buttons[2]?.pressed || false,
                    Y: pad.buttons[3]?.pressed || false,
                    LB: pad.buttons[4]?.pressed || false,
                    RB: pad.buttons[5]?.pressed || false,
                    Back: pad.buttons[8]?.pressed || false,
                    Start: pad.buttons[9]?.pressed || false,
                    LS: pad.buttons[10]?.pressed || false,
                    RS: pad.buttons[11]?.pressed || false,
                    Up: pad.buttons[12]?.pressed || false,
                    Down: pad.buttons[13]?.pressed || false,
                    Left: pad.buttons[14]?.pressed || false,
                    Right: pad.buttons[15]?.pressed || false
                }

            };

            outEl.textContent = JSON.stringify(payload,null,4);
        }
    }
    requestAnimationFrame(poll);
}

poll()

</script>
